<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applicant Form | Starkson Packaging Inc.</title>
  <link rel="icon" href="../../favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="applicantPage" class="view active">
    <div class="form-card">
      <header class="form-header">
        <a class="back-link" href="../../tools.html">&larr; Back to Tools</a>
        <div class="brand-mini">
          <span class="brand-name">STARKSON</span> HR PORTAL
        </div>
        <h1>Applicant Information Form</h1>
      </header>

      <form id="applicantForm" novalidate>
        <div class="form-group">
          <label for="applicantName">Full name <span class="req">*</span></label>
          <input type="text" id="applicantName" name="applicantName" placeholder="e.g. Maria Santos" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="applicantEmail">Email <span class="req">*</span></label>
            <input type="email" id="applicantEmail" name="applicantEmail" placeholder="name@gmail.com" required>
          </div>
          <div class="form-group">
            <label for="applicantPhone">Phone <span class="req">*</span></label>
            <input type="tel" id="applicantPhone" name="applicantPhone" placeholder="09XX XXX XXXX" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="applicantPosition">Position applying for <span class="req">*</span></label>
            <input type="text" id="applicantPosition" name="applicantPosition" placeholder="e.g. Production Operator" required>
          </div>
          <div class="form-group">
            <label for="applicantDepartment">Department <span class="req">*</span></label>
            <select id="applicantDepartment" name="applicantDepartment" required>
              <option value="">Select department</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="applicantSource">How did you hear about this opportunity? <span class="optional">(optional)</span></label>
            <input type="text" id="applicantSource" name="applicantSource" placeholder="e.g. Facebook, Referral, Job Fair">
          </div>
          <div class="form-group">
            <label for="applicantLinkedIn">LinkedIn / portfolio <span class="optional">(optional)</span></label>
            <input type="url" id="applicantLinkedIn" name="applicantLinkedIn" placeholder="https://linkedin.com/in/yourprofile">
          </div>
        </div>

        <div class="form-group">
          <label for="applicantNotes">Tell us a little about yourself <span class="optional">(optional)</span></label>
          <textarea id="applicantNotes" name="applicantNotes" rows="4" placeholder="Share your background, strengths, or relevant experience..."></textarea>
        </div>

        <div class="form-row step-actions">
          <button type="button" class="secondary-btn" id="applicantResetBtn">Clear</button>
          <button type="submit" class="primary-btn">Submit Application</button>
        </div>
      </form>

      <div id="applicantStatusMessage" class="status-box hidden" aria-live="polite"></div>
    </div>
  </main>

  <script src="../shared/api-config.js"></script>
  <script src="../shared/departments.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
